name: Setup environment
description: Setup environment with Vite+, Node.js, and the package manager

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: .node-version
        cache: true
        # Defer to our own "Install dependencies" step so the JSON Schema test
        # suite cache below is restored first.
        run-install: false

    - name: Restore JSON Schema test suite
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/json-schema-tests/.cache
        key: ${{ runner.os }}-json-schema-test-suite-${{ hashFiles('json-schema-tests/constants/sha.gen.ts') }}

    - name: Install dependencies
      shell: bash
      run: vp install
