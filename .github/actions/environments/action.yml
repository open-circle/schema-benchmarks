name: Setup environment
description: Setup environment with Node.js and pnpm

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    - name: Restore ttsc native cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/ttsc-cache
          ${{ runner.temp }}/ttsc-go-build
        key: ${{ runner.os }}-ttsc-native-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-ttsc-native-

    - name: Install dependencies
      shell: bash
      env:
        TTSC_CACHE_DIR: ${{ runner.temp }}/ttsc-cache
        TTSC_GO_CACHE_DIR: ${{ runner.temp }}/ttsc-go-build
      run: pnpm install
