name: Setup environment
description: Setup environment with Node.js and pnpm

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Restore JSON Schema test suite
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/json-schema-tests/.cache
        key: ${{ runner.os }}-json-schema-test-suite-${{ hashFiles('json-schema-tests/constants/sha.gen.ts') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install
