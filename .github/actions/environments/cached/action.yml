name: Setup environment and TTSC native cache
description: Setup environment with Node.js and pnpm, and restore TTSC native cache

runs:
  using: composite
  steps:
    - uses: ./.github/actions/environments

    - name: Restore ttsc native cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/ttsc-cache
          ${{ runner.temp }}/ttsc-go-build
        key: ${{ runner.os }}-ttsc-native-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-ttsc-native-${{ github.workflow }}-
