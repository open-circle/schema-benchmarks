name: Setup environment and TTSC native cache
description: Setup environment with Node.js and pnpm, and restore TTSC native cache

inputs:
  cache-prefix:
    description: Prefix for the TTSC cache key
    required: false
    default: ${{ github.workflow }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/environments

    - name: Restore ttsc native cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.ttsc-cache
        key: ${{ runner.os }}-ttsc-native-${{ inputs.cache-prefix }}-${{ hashFiles('pnpm-lock.yaml', '**/go.mod', '**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-ttsc-native-${{ inputs.cache-prefix }}-

    - name: Prepare ttsc cache
      shell: bash
      env:
        TTSC_CACHE_DIR: ${{ github.workspace }}/.ttsc-cache
      run: pnpm -C schemas/ exec ttsc prepare
