name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup environment
        uses: ./.github/actions/environments/cached
      - name: Build schemas
        shell: bash
        env:
          TTSC_CACHE_DIR: ${{ github.workspace }}/.ttsc-cache
        run: pnpm schemas:build
      - name: Save ttsc native cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ttsc-cache
          key: ${{ runner.os }}-ttsc-native-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '**/go.mod', '**/go.sum') }}
      - name: Build website
        run: pnpm website:build
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            schemas/dist/
            website/dist/
            website/.content-collections/
            website/.netlify/
          retention-days: 1
          include-hidden-files: true

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup environment
        uses: ./.github/actions/environments
      - uses: CatChen/oxlint-suggestion-action@dc539cb60f7eea545f47495c279379dc55cfe1d7 # v1.0.11
        with:
          fail-check: true
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Format
        run: pnpm format
      - uses: CatChen/check-git-status-action@cc5a79733c441f67cd0cd076de116cd2eebcebfe # v2.1.3
        with:
          fail-if-not-clean: true
          request-changes-if-not-clean: true
          request-changes-comment: "Unformatted files detected. Please run `pnpm format` and commit the changes."
  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Typecheck
        run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Test
        run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: E2E Smoke tests
        run: pnpm e2e --workers 50% --grep @smoke
      - name: E2E Full tests
        if: >-
          github.event_name == 'push' ||
          github.actor == 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'full e2e')
        run: pnpm e2e --workers 50% --grep-invert @smoke
      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: "*/playwright-report/"
          retention-days: 30
  storybook-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Build Storybook
        run: pnpm --filter website storybook:build
      - name: Upload Storybook Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-build-artifacts
          path: "website/storybook-static/"
          retention-days: 30
