name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup environment
        uses: ./.github/actions/environments/cached
      - name: Build schemas
        shell: bash
        env:
          TTSC_CACHE_DIR: ${{ github.workspace }}/.ttsc-cache
        run: vpr schemas:build
      - name: Save ttsc native cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ttsc-cache
          key: ${{ runner.os }}-ttsc-native-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', '**/go.mod', '**/go.sum') }}
      - name: Build website
        run: vpr website:build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            schemas/dist/
            website/dist/
            website/.content-collections/
            website/.netlify/
          retention-days: 1
          include-hidden-files: true

  lint:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Lint
        run: vp lint --format=github
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Format
        run: vpr format
      - uses: CatChen/check-git-status-action@cc5a79733c441f67cd0cd076de116cd2eebcebfe # v2.1.3
        with:
          fail-if-not-clean: true
          request-changes-if-not-clean: true
          request-changes-comment: "Unformatted files detected. Please run `vpr format` and commit the changes."
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: vp exec playwright install-deps chromium
      - name: Install Playwright browsers
        run: vp exec playwright install --no-shell chromium
      - name: Test
        run: vpr test
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-firefox-webkit-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: vp exec playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers
        run: vp exec playwright install --no-shell chromium firefox webkit
      - name: E2E Smoke tests
        run: vpr e2e --workers 50% --grep @smoke
      - name: E2E Full tests
        if: >-
          github.event_name == 'push' ||
          github.actor == 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'full e2e')
        run: vpr e2e --workers 50% --grep-invert @smoke
      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: "*/playwright-report/"
          retention-days: 30
  storybook-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Build Storybook
        run: vpr --filter website storybook:build
      - name: Upload Storybook Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-build-artifacts
          path: "website/storybook-static/"
          retention-days: 30
