name: PR Benchmark Preview
permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "bench/**"
      - "schemas/**"

concurrency:
  group: bench-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_author.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
      - id: check_author
        shell: bash
        run: |
          head_commit_author="$(git show -s --format='%an' "${{ github.event.pull_request.head.sha }}")"
          head_commit_message="$(git show -s --format='%s' "${{ github.event.pull_request.head.sha }}")"
          if [[ "$head_commit_author" == 'github-actions[bot]' && "$head_commit_message" == Update\ bench\ results* ]]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

  build-schemas:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
      - name: Setup environment
        uses: ./.github/actions/environments/cached
        with:
          cache-prefix: bench
      - name: Build schemas
        shell: bash
        env:
          TTSC_CACHE_DIR: ${{ github.workspace }}/.ttsc-cache
        run: pnpm schemas:build
      - name: Save ttsc native cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ttsc-cache
          key: ${{ runner.os }}-ttsc-native-bench-${{ hashFiles('pnpm-lock.yaml', '**/go.mod', '**/go.sum') }}
      - name: Upload schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemas-build
          path: schemas/dist/
          retention-days: 1

  bench-stack:
    needs: [gate, build-schemas]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
      - name: Download schemas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schemas-build
          path: schemas/dist/
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Run stack benchmark
        run: pnpm bench:stack
      - name: Upload stack results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-results
          path: bench/stack.json

  bench-download:
    needs: [gate, build-schemas]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
      - name: Download schemas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schemas-build
          path: schemas/dist/
      - name: Setup environment
        uses: ./.github/actions/environments/cached
        with:
          cache-prefix: bench
      - name: Run download benchmark
        env:
          TTSC_CACHE_DIR: ${{ github.workspace }}/.ttsc-cache
        run: pnpm bench:download
      - name: Save ttsc native cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ttsc-cache
          key: ${{ runner.os }}-ttsc-native-bench-${{ hashFiles('pnpm-lock.yaml', '**/go.mod', '**/go.sum') }}
      - name: Upload download results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-results
          path: |
            bench/download.json
            schemas/libraries/**/download_compiled/**

  bench-bench:
    needs: [gate, build-schemas]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
      - name: Download schemas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schemas-build
          path: schemas/dist/
      - name: Setup environment
        uses: ./.github/actions/environments
      - name: Run bench benchmark
        run: pnpm bench:bench
      - name: Upload bench results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/bench.json

  push-results:
    needs: [gate, bench-stack, bench-download, bench-bench]
    if: >-
      needs.gate.outputs.should_run == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - parallel:
          - name: Download bench results
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: bench-results
              path: bench
          - name: Download stack results
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: stack-results
              path: bench
          - name: Download download results
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: download-results
              path: .

      - name: Derive short commit SHA
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "SHORT_SHA=${SOURCE_SHA::7}" >> "$GITHUB_ENV"

      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # v1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}
          message: "Update bench results (${{ env.SHORT_SHA }})"
