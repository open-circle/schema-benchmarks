packages:
  - website
  - bench
  - utils
  - schemas
  - json-schema-tests
allowBuilds:
  "@parcel/watcher": false
  ata-validator: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
catalog:
  "@oxfmt/binding-linux-x64-gnu": ^0.72.0
  "@standard-schema/spec": ^1.1.0
  "@ttsc/unplugin": "0.30.4"
  "@types/node": ^26
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
  "@vitest/expect": ^5.0.2
  "@vitest/pretty-format": 5.0.3
  dedent: ^1.7.2
  "mix-n-matchers": "^3.0.0"
  mutative: "^1.3.0"
  playwright: ^1.63.0
  react: ^19.3.0
  react-dom: ^19.3.0
  ttsc: "0.30.4"
  typebox: ^1.3.36
  typescript: 7.0.2
  "up-fetch": "^2.6.1"
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
minimumReleaseAgeExcludePrune: true
overrides:
  "@opentelemetry/api": ^1.9.1
  "@types/node": ^26
  rolldown: 1.2.12
