packages:
  - website
  - bench
  - utils
  - schemas
  - json-schema-tests
allowBuilds:
  "@parcel/watcher": false
  ata-validator: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
catalog:
  "@mionjs/bin-compiler": "0.14.0"
  "@mionjs/devtools": "0.14.0"
  "@oxfmt/binding-linux-x64-gnu": ^0.78.0
  "@ttsc/unplugin": "0.37.0"
  "@types/node": ^26
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
  "@vitest/expect": 5.1.0
  "@vitest/pretty-format": 5.1.0
  dedent: ^1.7.2
  "mix-n-matchers": "^3.0.0"
  mutative: "^2.0.2"
  playwright: ^1.65.0
  react: ^19.3.1
  react-dom: ^19.3.1
  ttsc: "0.37.0"
  typebox: ^1.4.6
  typescript: 7.0.2
  "up-fetch": "^2.6.1"
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
minimumReleaseAgeExcludePrune: true
overrides:
  "@opentelemetry/api": ^1.9.1
  "@types/node": ^26
  msw: ^3.0.2
  rolldown: 1.2.18
  vite@*: "catalog:"
  vitest@*: "catalog:"
update:
  githubActions: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  "@mionjs/run-types":
    skills: [rt-enrich-types, runtypes-friendly-text, runtypes-mock-data]
  "@tanstack/charts":
    skills:
      [
        build-chart-interactions,
        compose-marks-and-views,
        configure-scales-guides-color,
        coordinate-charts-with-tanstack,
        debug-and-verify-charts,
        design-a-chart,
        design-responsive-charts,
        extend-tanstack-charts,
        prepare-chart-data,
        ship-accessible-charts,
        update-and-animate-charts,
      ]
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-router":
    skills: [router-query, react-router]
  "@tanstack/react-start":
    skills: [react-start]
  arktype:
    skills: true
  up-fetch:
    skills: true
skills:
  dirs:
    - .agents/skills
